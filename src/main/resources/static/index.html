<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenGrassland - 校园同好活动平台</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
</head>
<body>
    <div id="offlineBanner" class="offline-banner">网络连接已断开</div>
    <nav class="mobile-nav" id="mobileNav">
        <div class="mobile-nav-item active" onclick="switchTab('posts')"><span>🏠</span><span>首页</span></div>
        <div class="mobile-nav-item" onclick="switchTab('create')"><span>➕</span><span>发布</span></div>
        <div class="mobile-nav-item" onclick="switchTab('messages')"><span>💬</span><span>消息</span></div>
        <div class="mobile-nav-item" onclick="switchTab('myProfile')"><span>👤</span><span>我的</span></div>
    </nav>
    <div class="header">
        <div class="header-inner">
            <div class="header-brand">
                <div class="header-logo">🌿</div>
                <span class="header-title">青青草原</span>
                <span class="header-subtitle">校园同好活动平台</span>
            </div>
            <div style="display:flex;align-items:center;gap:12px;">
                <button class="notification-icon" onclick="toggleDarkMode()" id="darkModeBtn" title="暗色模式">🌙</button>
                <button class="notification-icon" onclick="toggleNotificationModal()" id="notificationIcon" title="通知">🔔
                    <span class="notification-badge" id="notificationBadge">0</span>
                </button>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="content">
            <!-- 用户信息区域 -->
            <div id="userInfo" class="user-info hidden">
                <div class="avatar-container">
                    <img id="userAvatar" src="/images/default-avatar.svg" alt="头像" class="avatar" onclick="document.getElementById('avatarUpload').click()" style="width:48px;height:48px;border-radius:50%;object-fit:cover;border:3px solid var(--primary-light);cursor:pointer;">
                    <div>
                        <strong>当前用户：</strong><span id="currentUsername"></span>
                        <br>
                        <label for="avatarUpload" class="avatar-upload-label">更换头像</label>
                        <input type="file" id="avatarUpload" class="avatar-upload" accept="image/jpeg,image/jpg,image/png,image/gif,image/webp" onchange="uploadAvatar(event)">
                    </div>
                </div>
                <div class="user-details">
                    <div></div>
                    <div class="user-actions">
                        <button class="btn btn-secondary" onclick="logout()">登出</button>
                    </div>
                </div>
            </div>

            <!-- 消息提示区域 -->
            <div id="message"></div>

            <!-- 标签页 -->
            <div class="tabs">
                <button id="loginTab" class="tab active" onclick="switchTab('login')">登录 / 注册</button>
                <button id="registerTab" class="tab hidden" onclick="switchTab('register')" style="display:none;"></button>
                <button class="tab" onclick="switchTab('posts')">🔥 活动广场</button>
                <button class="tab" onclick="switchTab('create')">✨ 发布活动</button>
                <button class="tab" onclick="switchTab('myPosts')">📝 我的发布</button>
                <button class="tab" onclick="switchTab('myRegistrations')">📋 我的报名</button>
                <button class="tab" onclick="switchTab('myProfile')">👤 我的主页</button>
                <button class="tab" onclick="switchTab('messages')">💬 消息</button>
            </div>

            <!-- 智能登录/注册（二合一） -->
            <div id="login" class="tab-content active">
                <div class="form-container">
                    <h2 id="authTitle" style="text-align:center;margin-bottom:28px;font-size:22px;font-weight:800;color:var(--text);">欢迎回来 👋</h2>
                <form onsubmit="smartAuth(event)">
                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" id="loginUsername" required placeholder="请输入用户名">
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" id="loginPassword" required placeholder="请输入密码">
                    </div>
                    <div id="registerFields" style="display:none;">
                    <div class="form-group">
                        <label>昵称</label>
                        <input type="text" id="regNickname" placeholder="给自己取个好听的名字">
                    </div>
                    <div class="form-group">
                        <label>邮箱</label>
                        <input type="email" id="regEmail" placeholder="选填">
                    </div>
                    </div>
                    <button type="submit" id="authSubmitBtn" class="btn btn-primary" style="width:100%;justify-content:center;padding:14px;">登 录</button>
                    <div style="text-align:center;margin-top:16px;">
                        <a href="#" onclick="toggleRegisterFields(event)" style="color:var(--primary-dark);font-size:14px;font-weight:500;text-decoration:none;">没有账号？创建新账号 →</a>
                    </div>
                </form>
                </div>
            </div>

            <!-- 注册兼容（隐藏，保持tab切换兼容） -->
            <div id="register" class="tab-content"></div>

            <!-- 活动列表 -->
            <div id="posts" class="tab-content">
                <div id="featuredSection" class="featured-section" style="display:none;">
                    <div class="featured-title">✨ 精选活动</div>
                    <div id="featuredPosts" class="featured-posts"></div>
                </div>
                <div id="recommendSection" class="featured-section" style="display:none;background:linear-gradient(135deg,#eff6ff,#faf5ff);border-color:#818cf8;">
                    <div class="featured-title" style="color:#4f46e5;">🎯 你可能感兴趣</div>
                    <div id="recommendPosts" class="featured-posts"></div>
                </div>
                <div class="search-container">
                    <div class="search-box-wrapper">
                        <input type="text" id="searchKeyword" class="search-input" placeholder="🔍  搜索感兴趣的活动..." onkeypress="if(event.key==='Enter') searchPosts()" onfocus="renderSearchHistory()">
                        <button class="search-btn" onclick="searchPosts()">🔍</button>
                        <button class="filter-btn" onclick="toggleFilterPanel()">⚙ 筛选</button>
                    </div>
                    <div id="searchHistory" class="search-history" style="display:none;"></div>
                    <div class="hot-tags-container" id="hotTags"></div>
                    <div id="filterPanel" class="filter-panel hidden">
                        <div class="filter-row">
                            <label>位置</label>
                            <input type="text" id="searchLocation" class="filter-select" placeholder="例如：体育馆、图书馆..." onkeypress="if(event.key==='Enter') searchPosts()">
                        </div>
                        <div class="filter-row">
                            <label>类型</label>
                            <select id="searchType" class="filter-select">
                                <option value="">全部类型</option>
                                <option value="BALL_GAME">🏀 打球</option>
                                <option value="BOARD_GAME">🎲 桌游</option>
                                <option value="PET_SOCIAL">🐾 宠物社交</option>
                                <option value="GROUP_ACTIVITY">🎉 拼活动</option>
                                <option value="STUDY_GROUP">📚 学习小组</option>
                            </select>
                        </div>
                        <div class="filter-row">
                            <label>排序</label>
                            <select id="searchSortBy" class="filter-select">
                                <option value="createTime">创建时间</option>
                                <option value="activityTime">活动时间</option>
                            </select>
                            <select id="searchSortOrder" class="filter-select">
                                <option value="DESC">最新优先</option>
                                <option value="ASC">最早优先</option>
                            </select>
                        </div>
                        <div class="filter-actions">
                            <button class="filter-reset-btn" onclick="resetSearch()">重置</button>
                            <button class="filter-apply-btn" onclick="searchPosts()">应用筛选</button>
                        </div>
                    </div>
                </div>
                <div id="postList" class="post-list"></div>
            </div>

            <!-- 发布活动表单 -->
            <div id="create" class="tab-content">
                <div class="form-container" style="max-width:640px;">
                    <h2 style="text-align:center;margin-bottom:28px;font-size:22px;font-weight:800;color:var(--text);">发布新活动 ✨</h2>
                <form onsubmit="createPost(event)">
                    <div class="form-group">
                        <label>活动标题 *</label>
                        <input type="text" id="postTitle" required placeholder="给活动取个吸引人的标题" oninput="markFormDirty()">
                    </div>
                    <div class="form-group">
                        <label>活动描述</label>
                        <textarea id="postContent" placeholder="详细描述你的活动安排..."></textarea>
                    </div>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
                    <div class="form-group">
                        <label>活动类型 *</label>
                        <select id="postType" required>
                            <option value="BALL_GAME">🏀 打球</option>
                            <option value="BOARD_GAME">🎲 桌游</option>
                            <option value="PET_SOCIAL">🐾 宠物社交</option>
                            <option value="GROUP_ACTIVITY">🎉 拼活动</option>
                            <option value="STUDY_GROUP">📚 学习小组</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>最大人数 *</label>
                        <input type="number" id="postMaxPeople" min="1" value="10" required>
                    </div>
                    </div>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
                    <div class="form-group">
                        <label>活动时间</label>
                        <input type="datetime-local" id="postActivityTime">
                    </div>
                    <div class="form-group">
                        <label>活动地点 *</label>
                        <input type="text" id="postLocation" required placeholder="在哪见面？例如：体育馆、图书馆三楼">
                        <input type="hidden" id="postLatitude">
                        <input type="hidden" id="postLongitude">
                        <button type="button" class="btn btn-secondary" onclick="getCurrentPosition()" style="margin-top:8px;font-size:12px;">📍 使用当前位置</button>
                    </div>
                    </div>
                    <div class="form-group">
                        <label>上传图片（可选，最多9张）</label>
                        <input type="file" id="postImages" multiple accept="image/jpeg,image/jpg,image/png,image/gif,image/webp" onchange="handlePostImageUpload(event)" style="padding:10px;">
                        <div id="postImagePreview" class="image-preview-container"></div>
                        <input type="hidden" id="postImageUrls" value="">
                    </div>
                    <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:14px;font-size:16px;">🚀 发布活动</button>
                </form>
                </div>
            </div>

            <!-- 我的发布 -->
            <div id="myPosts" class="tab-content">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
                    <h2 style="font-size:18px;font-weight:700;">我的发布</h2>
                    <button class="btn btn-primary" onclick="loadMyPosts()">🔄 刷新</button>
                </div>
                <div id="myPostList" class="post-list"></div>
            </div>

            <!-- 我的报名 -->
            <div id="myRegistrations" class="tab-content">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
                    <h2 style="font-size:18px;font-weight:700;">我报名的活动</h2>
                    <button class="btn btn-primary" onclick="loadMyRegistrations()">🔄 刷新</button>
                </div>
                <div id="myRegistrationList" class="post-list"></div>
            </div>

            <!-- 我的主页 -->
            <div id="myProfile" class="tab-content">
                <div class="form-container" style="max-width:720px;">
                    <div id="profileContent">
                        <div class="detail-loading">
                            <div class="skeleton-card"><div class="skeleton skeleton-avatar" style="margin-bottom:8px;"></div><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line short"></div></div>
                            <div class="skeleton-card"><div class="skeleton skeleton-avatar" style="margin-bottom:8px;"></div><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line medium"></div></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 消息 -->
            <div id="messages" class="tab-content">
                <div class="chat-container">
                    <div class="chat-list" id="messageList">
                        <div class="chat-empty"><span class="chat-empty-icon">💬</span>加载中...</div>
                    </div>
                    <div class="chat-window" id="chatWindow" style="display: flex;">
                        <div class="chat-empty"><span class="chat-empty-icon">👋</span>选择一个聊天开始对话</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 帖子详情模态框 -->
    <div id="postDetailModal" class="detail-modal" style="display: none;">
        <div class="detail-modal-content">
            <div class="detail-modal-header">
                <h2 id="detailTitle">活动详情</h2>
                <span class="detail-close" onclick="closePostDetail()">&times;</span>
            </div>
            <div class="detail-modal-body" id="postDetailContent">
                <div class="detail-loading"><div class="skeleton skeleton-line" style="height:24px;width:40%;margin-bottom:12px;"></div><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line medium"></div><div class="skeleton skeleton-line short"></div></div>
            </div>
        </div>
    </div>

    <!-- 用户主页模态框 -->
    <div id="userProfileModal" class="detail-modal" style="display: none;">
        <div class="detail-modal-content" style="max-width: 500px;">
            <div class="detail-modal-header">
                <h2>用户主页</h2>
                <span class="detail-close" onclick="closeUserProfile()">&times;</span>
            </div>
            <div class="detail-modal-body" id="userProfileContent">
                <div class="detail-loading"><div class="skeleton skeleton-avatar" style="width:60px;height:60px;margin:0 auto 12px;"></div><div class="skeleton skeleton-line short" style="margin:0 auto 12px;"></div><div class="skeleton skeleton-line"></div></div>
            </div>
        </div>
    </div>

    <!-- 通知模态框 -->
    <div id="notificationModal" class="notification-modal">
        <div class="notification-header">
            <h3>🔔 通知</h3>
            <div style="display:flex;gap:4px;flex:1;justify-content:center;">
                <button class="notif-filter-btn active" id="notifFilterALL" onclick="setNotificationFilter('ALL')">全部</button>
                <button class="notif-filter-btn" id="notifFilterLIKE" onclick="setNotificationFilter('LIKE')">👍</button>
                <button class="notif-filter-btn" id="notifFilterCOMMENT" onclick="setNotificationFilter('COMMENT')">💬</button>
                <button class="notif-filter-btn" id="notifFilterFOLLOW" onclick="setNotificationFilter('FOLLOW')">👤</button>
            </div>
            <button class="notification-mark-all" onclick="markAllNotificationsAsRead()">全部已读</button>
        </div>
        <div class="notification-list" id="notificationList">
            <div class="notification-empty">暂无通知</div>
        </div>
    </div>

    <!-- 图片预览模态框 -->
    <div id="imagePreviewModal" class="image-preview-modal">
        <div class="image-preview-content">
            <button class="image-preview-close" onclick="closeImagePreview()">&times;</button>
            <button class="image-preview-nav prev" onclick="prevImage()" id="prevImageBtn">‹</button>
            <button class="image-preview-nav next" onclick="nextImage()" id="nextImageBtn">›</button>
            <img id="previewImage" class="image-preview-image" src="" alt="预览图片">
            <div class="image-preview-counter" id="imageCounter"></div>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
